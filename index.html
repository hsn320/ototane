<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <!-- 各ファイル -->
    <link rel="stylesheet" href="css/ress.css">
    <link rel="stylesheet" href="css/index.css">

    <title>farm</title>
</head>
<body>
    <div class="contain">

        <div class="content">

            <div class="topWrap">
                <!-- 家 -->
                <div class="homeWrap">
                    <img src="img/homeBtn.png" alt="家に戻る" class="homeBtn">
                    <img src="img/house.svg" alt="お家" class="homeImg">
                </div>
                <!-- キャラ -->
                <div>
                    <img src="img/guideChara.png" alt="" class="guideChara">
                </div>
            </div>

            <!-- 畑 -->
            <div class="farmWrap">
                <div class="farmContent">
                    <img src="img/farmBase.svg" alt="">
                </div>
            </div>

            <!-- ボタン各種 -->
            <div class="btnWrap">
                <div class="btn seed">
                    <img src="img/seed.svg" alt="" class="seed">
                    <p>種まき</p>
                </div>
                <div class="btn water">
                    <img src="img/water.svg" alt="" class="water">
                    <p>水やり</p>
                </div>
                <div class="btn music">
                    <img src="img/music.svg" alt="" class="music">
                    <p>音楽</p>
                </div>
            </div>


            <!-- ナビゲーション -->
            <div class="nav">
                <div class="navLink">
                    <a href="#">
                        <img src="img/home.svg" alt="">
                        <p>いえ</p>
                    </a>
                </div>
                <div class="navLink">
                    <a href="#">
                        <img src="img/gatya.svg" alt="">
                        <p>ガチャ</p>
                    </a>
                </div>
                <div class="navLink navActive">
                    <a href="index.html">
                        <img src="img/farm.svg" alt="">
                        <p>畑</p>
                    </a>
                </div>
                <div class="navLink">
                    <a href="">
                        <img src="img/shop.svg" alt="">
                        <p>ショップ</p>
                    </a>
                </div>
                <div class="navLink">
                    <a href="">
                        <img src="img/exchange.svg" alt="">
                        <p>交換所</p>
                    </a>
                </div>
            </div>
        </div>



    </div>
</body>
</html>
